<!doctype html>
<html lang="my">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tweetnacl/1.0.3/nacl-fast.min.js"></script>
<style>
  :root{--g:linear-gradient(90deg,#ec4899,#3b82f6);--card:rgba(255,255,255,.06);--line:rgba(255,255,255,.14)}
  *{box-sizing:border-box}
  body{margin:0;background:#000;color:#fff;font-family:system-ui,sans-serif}
  .wrap{max-width:520px;margin:0 auto;padding:12px 14px 40px}
  h2{margin:8px 0}
  .tabs{display:flex;gap:6px;position:sticky;top:0;background:#000;padding:8px 0;z-index:5}
  .tabs button{flex:1;padding:10px 2px;font-size:14px;background:var(--card);border:1px solid var(--line);color:#fff;border-radius:10px;font-weight:700}
  .tabs button.on{background:var(--g);border-color:transparent}
  .tab{display:none}.tab.on{display:block}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0}
  label{display:block;font-weight:600;margin:8px 0 4px}
  input,select,textarea{width:100%;padding:11px;font-size:16px;color:#fff;background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:8px}
  select option{background:#111}
  ::placeholder{color:#777}
  button{padding:12px;border:0;border-radius:10px;font-size:16px;font-weight:700;margin-top:8px;color:#fff;cursor:pointer}
  .btn{width:100%;background:var(--g)}.btn:disabled{opacity:.5}
  .gray{background:rgba(255,255,255,.1);border:1px solid var(--line)}
  .del{background:rgba(239,68,68,.25);border:1px solid rgba(239,68,68,.6)}
  .row{display:flex;gap:8px}.row>*{flex:1}
  .mut{color:#aaa;font-size:14px}
  #msg{font-weight:600;min-height:22px;margin:6px 0}
  .item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin:8px 0}
  .kname{font-size:20px;font-weight:800;letter-spacing:1px}
  .acts{display:flex;gap:8px}.acts button{flex:1;margin-top:8px;padding:10px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}
  .stat b{display:block;font-size:26px;background:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent}
  .dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#22c55e;margin-right:8px}
</style>
<body>
<div class="wrap">
  <h2>🛠️ Admin</h2>
  <div class="tabs">
    <button data-t="gen" class="on">🔑 Key</button>
    <button data-t="his">📜 History</button>
    <button data-t="usr">👥 Users</button>
    <button data-t="set">⚙️ Setting</button>
  </div>
  <p id="msg"></p>

  <!-- Key ထုတ်ရန် -->
  <div id="gen" class="tab on">
    <div class="card">
      <label>1. သက်တန်း</label>
      <div class="row">
        <input id="n" type="number" min="1" inputmode="numeric" placeholder="ဥပမာ 15">
        <select id="unit"><option value="d">ရက်</option><option value="h">နာရီ</option></select>
      </div>
      <button class="btn" id="genBtn">2. Key ထုတ်မည်</button>
      <label>3. Key</label>
      <textarea id="out" readonly rows="4"></textarea>
      <button class="gray" style="width:100%" id="copyOut">Copy</button>
    </div>
  </div>

  <!-- History -->
  <div id="his" class="tab">
    <div class="row"><p class="mut" id="count" style="margin:10px 0"></p>
      <button class="gray" id="reload" style="flex:0 0 130px">🔄 ပြန်ဖတ်</button></div>
    <p class="mut" style="margin:0">သက်တန်းကုန်တဲ့ Key တွေ အလိုအလျောက် ပျက်သွားမယ်</p>
    <div id="list"></div>
  </div>

  <!-- Users -->
  <div id="usr" class="tab">
    <div id="stats"></div>
  </div>

  <!-- Setting -->
  <div id="set" class="tab">
    <div class="card">
      <label>SEED</label><input id="seed" type="password" placeholder="SEED">
      <label>GitHub Token</label><input id="tok" type="password" placeholder="github_pat_...">
      <label>Tracker လင့် (Apps Script /exec)</label><input id="trk" placeholder="https://script.google.com/.../exec">
      <label>Tracker စကားဝှက်</label><input id="trkpw" type="password" placeholder="Apps Script ထဲမှာ ပေးထားတဲ့စကားဝှက်">
      <button class="btn" id="save">💾 သိမ်းမည်</button>
      <p class="mut">ဒီဖုန်းထဲမှာပဲ မှတ်ထားမယ်၊ တစ်ခါထည့်ရင် ပြန်မထည့်ရတော့ဘူး</p>
    </div>
  </div>
</div>

<script>
const OWNER="kolinaungkolin123-cmyk", REPO="On3---Voice-Clone-", BRANCH="main";
const $=id=>document.getElementById(id);
const LS={get:k=>{try{return localStorage.getItem(k)||""}catch(e){return ""}},
          set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
const cfg=k=>LS.get(k).trim();
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const b64u=u=>btoa(String.fromCharCode(...u)).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
const enc=s=>btoa(unescape(encodeURIComponent(s)));
const dec=s=>decodeURIComponent(escape(atob(s.replace(/\n/g,""))));
const nowSec=()=>Math.floor(Date.now()/1000);
let DB={keys:[],revoked:[]};

function say(t,ok){const m=$("msg");m.textContent=t;m.style.color=ok===false?"#f87171":ok===true?"#4ade80":"#fff";}
async function copyText(t){
  if(!t) return say("Copy လုပ်စရာမရှိပါ",false);
  try{await navigator.clipboard.writeText(t);say("✅ Copy ပြီးပါပြီ",true)}
  catch(e){say("Copy မရပါ — ကိုယ်တိုင်ရွေးကူးပါ",false)}
}
function leftText(sec){
  if(sec<=0) return "သက်တမ်းကုန်";
  if(sec<3600) return Math.max(1,Math.ceil(sec/60))+" မိနစ်";
  if(sec<=86400) return Math.ceil(sec/3600)+" နာရီ";
  return Math.ceil(sec/86400)+" ရက်";
}
function dur(sec){
  if(sec<=0) return "";
  if(sec<=86400) return Math.ceil(sec/3600)+" နာရီ";
  return Math.ceil(sec/86400)+" ရက်";
}
const masked=id=>"VIP-******"+String(id).slice(-4);

/* ---------- GitHub ---------- */
const H=()=>({Authorization:"Bearer "+cfg("kg_tok"),Accept:"application/vnd.github+json"});
const API=p=>`https://api.github.com/repos/${OWNER}/${REPO}/contents/${p}`;
async function ghGet(path){
  const r=await fetch(`${API(path)}?ref=${BRANCH}&t=${Date.now()}`,{headers:H()});
  if(r.status===404) return {text:"",sha:null};
  if(!r.ok) throw new Error("GitHub error "+r.status+(r.status===401?" (Token မှားနေသည်)":""));
  const j=await r.json(); return {text:dec(j.content),sha:j.sha};
}
async function ghPut(path,text,sha,m){
  const body={message:m,content:enc(text),branch:BRANCH}; if(sha) body.sha=sha;
  const r=await fetch(API(path),{method:"PUT",headers:{...H(),"Content-Type":"application/json"},body:JSON.stringify(body)});
  if(!r.ok){
    let why="";
    if([401,403,404].includes(r.status)) why=" (Token ခွင့်ပြုချက် စစ်ပါ — Contents: Read and write)";
    throw new Error("သိမ်းမရပါ "+r.status+why);
  }
}
function norm(r){
  const s=String(r.exp); let exp;
  if(s.length===8) exp=Date.UTC(+s.slice(0,4),+s.slice(4,6)-1,+s.slice(6,8),23,59,59)/1000;
  else exp=Number(s);
  return {id:r.id,exp,created:r.created||"",label:r.label||(r.days?r.days+" ရက်":"")};
}
async function loadDB(){
  const f=await ghGet("keys.json");
  let raw; try{raw=JSON.parse(f.text||"{}")}catch(e){raw={}}
  let keys=[],revoked=[],legacy=Array.isArray(raw);
  if(legacy){raw.forEach(x=>{const r=norm(x); x.revoked?revoked.push({id:r.id,exp:r.exp}):keys.push(r)})}
  else{keys=(raw.keys||[]).map(norm);revoked=(raw.revoked||[]).map(norm)}
  const t=nowSec();
  const k2=keys.filter(r=>r.exp>t), v2=revoked.filter(r=>r.exp>t);
  return {db:{keys:k2,revoked:v2},sha:f.sha,
          changed:legacy||k2.length!==keys.length||v2.length!==revoked.length};
}
async function saveDB(db,sha,m){
  await ghPut("keys.json",JSON.stringify(db,null,1),sha,m);
  const rv=await ghGet("revoked.txt");
  await ghPut("revoked.txt","# revoked ids\n"+db.revoked.map(x=>x.id).join("\n")+"\n",rv.sha,m);
}
async function mutate(fn,m){
  for(let i=0;i<2;i++){
    const {db,sha}=await loadDB(); fn(db);
    try{await saveDB(db,sha,m);DB=db;return}
    catch(e){if(i===1||!/409|422/.test(e.message)) throw e}
  }
}

/* ---------- Key ---------- */
function makeKey(rec){
  const kp=nacl.sign.keyPair.fromSeed(b64(cfg("kg_seed")));
  const payload=`VIP.${rec.exp}.${rec.id}`;
  const sig=nacl.sign.detached(new TextEncoder().encode(payload),kp.secretKey);
  return `${payload}.${b64u(sig)}`;
}
$("genBtn").onclick=async()=>{
  const btn=$("genBtn");
  try{
    btn.disabled=true; say("လုပ်ဆောင်နေသည်...");
    if(!cfg("kg_tok")||!cfg("kg_seed")) throw new Error("Setting မှာ SEED နဲ့ Token အရင်ထည့်ပါ");
    const n=parseInt($("n").value);
    if(!n||n<1) throw new Error("သက်တန်း မှားနေသည်");
    const unit=$("unit").value;
    const exp=nowSec()+n*(unit==="h"?3600:86400);
    const id=Array.from(crypto.getRandomValues(new Uint8Array(4))).map(x=>x.toString(16).padStart(2,"0")).join("").toUpperCase();
    const rec={id,exp,created:new Date().toISOString(),label:n+(unit==="h"?" နာရီ":" ရက်")};
    let key; try{key=makeKey(rec)}catch(e){throw new Error("SEED မှားနေသည်")}
    await mutate(db=>db.keys.push(rec),"add key "+id);
    $("out").value=key; renderList();
    say("✅ အောင်မြင်ပါသည် — "+rec.label+" သုံးလို့ရမယ်",true);
  }catch(e){say("❌ "+e.message,false)}
  finally{btn.disabled=false}
};
$("copyOut").onclick=()=>copyText($("out").value);

/* ---------- History ---------- */
function renderList(){
  const t=nowSec();
  const rows=DB.keys.filter(r=>r.exp>t).slice().reverse();
  $("count").textContent=`သုံးလို့ရတဲ့ Key ${rows.length} ခု`;
  $("list").innerHTML=rows.map(r=>`
    <div class="item">
      <div class="kname">${masked(r.id)}</div>
      <div class="mut">⏳ ကျန်ချိန်: ${leftText(r.exp-t)}${r.label?" · သက်တန်း "+r.label:""}</div>
      <div class="acts">
        <button class="gray" onclick="copyKey('${r.id}')">Copy</button>
        <button class="del" onclick="delKey('${r.id}')">Delete</button>
      </div>
    </div>`).join("")||'<p class="mut">Key မရှိသေးပါ</p>';
}
async function refresh(){
  try{
    if(!cfg("kg_tok")) throw new Error("Setting မှာ GitHub Token ထည့်ပါ");
    say("ဖတ်နေသည်...");
    const {db,sha,changed}=await loadDB();
    if(changed){await saveDB(db,sha,"auto remove expired")}
    DB=db; renderList(); say("");
  }catch(e){say("❌ "+e.message,false)}
}
function copyKey(id){
  const r=DB.keys.find(x=>x.id===id); if(!r) return;
  try{copyText(makeKey(r))}catch(e){say("❌ SEED မှားနေသည်",false)}
}
async function delKey(id){
  if(!confirm(masked(id)+" ကို ဖျက်မလား?\nဖျက်ရင် Website မှာ သုံးလို့မရတော့ပါ။")) return;
  try{
    say("လုပ်ဆောင်နေသည်...");
    await mutate(db=>{
      const r=db.keys.find(x=>x.id===id); if(!r) return;
      db.keys=db.keys.filter(x=>x.id!==id);
      db.revoked.push({id:r.id,exp:r.exp});
    },"delete "+id);
    renderList(); say("🗑️ ဖျက်ပြီးပါပြီ",true);
  }catch(e){say("❌ "+e.message,false)}
}
$("reload").onclick=refresh;
setInterval(()=>{if($("his").classList.contains("on")) renderList()},60000);

/* ---------- Users ---------- */
function online(sec){
  if(sec<60) return sec+" စက္ကန့်";
  if(sec<3600) return Math.floor(sec/60)+" မိနစ်";
  return Math.floor(sec/3600)+" နာရီ "+Math.floor(sec%3600/60)+" မိနစ်";
}
async function loadStats(){
  const url=cfg("kg_trk");
  if(!url){$("stats").innerHTML='<div class="card mut">⚙️ Setting မှာ Tracker လင့်ထည့်ပါ</div>';return}
  try{
    const r=await fetch(url+"?action=stats&pw="+encodeURIComponent(cfg("kg_trkpw"))+"&t="+Date.now());
    const j=await r.json();
    if(!j.ok) throw new Error(j.msg||"မှားနေသည်");
    $("stats").innerHTML=`
      <div class="grid">
        <div class="stat"><b>${j.live.length}</b>အခု သုံးနေသူ</div>
        <div class="stat"><b>${j.today}</b>ယနေ့ ဝင်ကြည့်</div>
        <div class="stat"><b>${j.total}</b>စုစုပေါင်း ဝင်ကြည့်</div>
        <div class="stat"><b>${j.unique}</b>လူ အရေအတွက်</div>
      </div>
      <h3>🟢 အခု အသုံးပြုနေသူများ</h3>
      ${j.live.map(u=>`<div class="item"><span class="dot"></span><b>${u.k?masked(u.k):"Key မထည့်ရသေး"}</b>
        <div class="mut">ဝင်ထားတာ ${online(u.online)}</div></div>`).join("")||'<p class="mut">ဘယ်သူမှ မရှိသေးပါ</p>'}`;
  }catch(e){$("stats").innerHTML='<div class="card" style="color:#f87171">❌ '+e.message+'</div>'}
}
setInterval(()=>{if($("usr").classList.contains("on")) loadStats()},15000);

/* ---------- Tabs / Setting ---------- */
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{
  document.querySelectorAll(".tabs button").forEach(x=>x.classList.toggle("on",x===b));
  document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("on",x.id===b.dataset.t));
  say("");
  if(b.dataset.t==="his") refresh();
  if(b.dataset.t==="usr") loadStats();
});
$("save").onclick=()=>{
  LS.set("kg_seed",$("seed").value.trim()); LS.set("kg_tok",$("tok").value.trim());
  LS.set("kg_trk",$("trk").value.trim()); LS.set("kg_trkpw",$("trkpw").value.trim());
  say("✅ သိမ်းပြီးပါပြီ",true);
};
$("seed").value=LS.get("kg_seed"); $("tok").value=LS.get("kg_tok");
$("trk").value=LS.get("kg_trk"); $("trkpw").value=LS.get("kg_trkpw");
</script>
</body>
</html>
